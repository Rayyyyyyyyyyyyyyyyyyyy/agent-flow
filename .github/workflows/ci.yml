name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: github.event_name == 'pull_request'
        run: python3 scripts/check_version.py origin/${{ github.base_ref }}
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: python3 scripts/no_cjk.py plugins/agent-flow
      - run: python3 scripts/check_package.py
      - name: Install into fresh HOME
        run: |
          export HOME="$(mktemp -d)"
          claude plugin marketplace add "$PWD"
          claude plugin install agent-flow@agent-flow
          claude plugin list | grep agent-flow
      - run: python3 -m unittest discover -s tests -v
