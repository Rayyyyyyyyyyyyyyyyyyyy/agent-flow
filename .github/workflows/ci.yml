name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: python3 scripts/no_cjk.py plugins/agent-flow
      - run: python3 scripts/check_package.py
      - name: Install into fresh HOME
        run: |
          export HOME="$(mktemp -d)"
          claude plugin marketplace add "$PWD"
          claude plugin install agent-flow@agent-flow
          claude plugin list | grep agent-flow
      - run: python3 -m unittest discover -s tests -v
  sandbox-bwrap:
    name: sandbox (ubuntu-bwrap)
    runs-on: ubuntu-latest
    env:
      AGENT_FLOW_REQUIRE_SANDBOX: bwrap
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Allow unprivileged user namespaces (Ubuntu 24.04 AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: python3 -m unittest tests.test_sandbox -v
  sandbox-none:
    name: sandbox (none)
    runs-on: ubuntu-latest
    env:
      AGENT_FLOW_SANDBOX: none
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_sandbox.NoSandbox -v
